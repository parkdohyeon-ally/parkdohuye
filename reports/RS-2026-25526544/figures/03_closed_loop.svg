<text x="72" y="1061" font-size="23" fill="#7554a3" text-anchor="start" font-weight="700"><tspan x="72" dy="0">루프 A · 실험 의사결정 갱신</tspan></text>
<text x="72" y="1097" font-size="20" fill="#142d4e" text-anchor="start" font-weight="400"><tspan x="72" dy="0">성균관대: 결과 → 다음 조건·탐색 정책 변경</tspan></text>
