<text x="54" y="55" font-size="32" fill="#142d4e" text-anchor="start" font-weight="700"><tspan x="54" dy="0">03  자율실험의 한 사이클과 두 피드백 루프</tspan></text>
<text x="54" y="93" font-size="17" fill="#607186" text-anchor="start" font-weight="400"><tspan x="54" dy="0">기능 순서를 재구성한 도식 · 점선의 기관 간 직접 호출 규격은 계획서에 미확정 · DT 경유 제어는 병행 가능한 경로</tspan></text>
