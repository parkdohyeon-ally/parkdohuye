<rect x="815" y="1040" width="5" height="64" rx="2" fill="#087e8b"/>
<text x="837" y="1061" font-size="23" fill="#087e8b" text-anchor="start" font-weight="700"><tspan x="837" dy="0">루프 B · 예측 모델 갱신</tspan></text>
<text x="837" y="1097" font-size="19" fill="#142d4e" text-anchor="start" font-weight="400"><tspan x="837" dy="0">인실리코: 신규 데이터 → 재학습 → 비교 검증 → 배포</tspan></text>
<text x="54" y="1151" font-size="16" fill="#607186" text-anchor="start" font-weight="400"><tspan x="54" dy="0">근거: PDF 26–28, 34–41, 45–50, 62–63쪽. KETI는 예측-실측·가상-실물 정합성과 전체 통합 결과를 검증.</tspan></text>
